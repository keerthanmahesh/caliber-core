# ===================================================================
# Development Profile Configuration (dev)
# ===================================================================
server.port=${PORT:8087}

# MongoDB Connection
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/caliber}
spring.mongodb.database=${MONGODB_DATABASE:caliber}

# Actuator Health & Metrics
management.endpoint.health.show-details=always
management.health.mongodb.enabled=false

# Security and JWT
security.jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS0zMmJ5dGU=}
security.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:30}
security.service.expiry-days=${SERVICE_EXPIRY_DAYS:1}

# Cookie Flags (HTTP in dev)
security.cookie.secure=${COOKIE_SECURE:false}

# CORS Configuration
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging
logging.level.root=INFO
logging.level.com.caliber=DEBUG
logging.level.org.springframework.data.mongodb=INFO

# Caliber AI Engine Defaults (Ollama primary, Gemini fallback)
caliber.ai.ollama.api-key=${OLLAMA_API_KEY:}
caliber.ai.ollama.model=${OLLAMA_MODEL:gpt-oss:120b}
caliber.ai.ollama.base-url=${OLLAMA_BASE_URL:}
caliber.ai.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:120}
caliber.ai.gemini.api-key=${GEMINI_API_KEY:}
caliber.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
caliber.ai.gemini.base-url=${GEMINI_BASE_URL:}
caliber.ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:240}
caliber.ai.max-body-chars=${AI_MAX_BODY_CHARS:10000}

# Caliber Gmail Integration Defaults
caliber.gmail.client-id=${GMAIL_CLIENT_ID:}
caliber.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
caliber.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
caliber.gmail.redirect-uri=${GMAIL_REDIRECT_URI:http://localhost:3000/settings}
caliber.gmail.poll-interval-ms=${GMAIL_POLL_INTERVAL_MS:60000}
caliber.gmail.scope=${GMAIL_SCOPE:}
caliber.gmail.auth-url=${GMAIL_AUTH_URL}
caliber.gmail.token-url=${GMAIL_TOKEN_URL}
caliber.gmail.token-expiry-seconds=${GMAIL_TOKEN_EXPIRY_SECONDS:3600}
caliber.gmail.max-results=${GMAIL_MAX_RESULTS:50}
