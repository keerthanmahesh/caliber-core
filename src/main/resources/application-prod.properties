# ===================================================================
# Production Profile Configuration (prod)
# ===================================================================
server.port=${PORT}

# MongoDB Connection
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE}

# Actuator Health & Metrics
management.endpoint.health.show-details=when-authorized
management.health.mongodb.enabled=false

# Security and JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:30}
security.service.expiry-days=${SERVICE_EXPIRY_DAYS:1}

# Cookie Flags (HTTPS in prod)
security.cookie.secure=${COOKIE_SECURE:true}

# CORS Configuration
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging
logging.level.root=INFO
logging.level.com.caliber=INFO
logging.level.org.springframework.data.mongodb=WARN

# Caliber AI Engine Defaults (Ollama primary, Gemini fallback)
caliber.ai.ollama.api-key=${OLLAMA_API_KEY:}
caliber.ai.ollama.model=${OLLAMA_MODEL}
caliber.ai.ollama.base-url=${OLLAMA_BASE_URL}
caliber.ai.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS}
caliber.ai.gemini.api-key=${GEMINI_API_KEY}
caliber.ai.gemini.model=${GEMINI_MODEL}
caliber.ai.gemini.base-url=${GEMINI_BASE_URL}
caliber.ai.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS}
caliber.ai.max-body-chars=${AI_MAX_BODY_CHARS}

# Caliber Gmail Integration Defaults
caliber.gmail.client-id=${GMAIL_CLIENT_ID}
caliber.gmail.client-secret=${GMAIL_CLIENT_SECRET}
caliber.gmail.refresh-token=${GMAIL_REFRESH_TOKEN}
caliber.gmail.redirect-uri=${GMAIL_REDIRECT_URI}
caliber.gmail.poll-interval-ms=${GMAIL_POLL_INTERVAL_MS}
caliber.gmail.poll-enabled=${GMAIL_POLL_ENABLED}
caliber.gmail.auto-archive=${GMAIL_AUTO_ARCHIVE}
caliber.gmail.scope=${GMAIL_SCOPE}
caliber.gmail.auth-url=${GMAIL_AUTH_URL}
caliber.gmail.token-url=${GMAIL_TOKEN_URL}
caliber.gmail.token-expiry-seconds=${GMAIL_TOKEN_EXPIRY_SECONDS}
caliber.gmail.max-results=${GMAIL_MAX_RESULTS}
