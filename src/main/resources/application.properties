spring.application.name=caliber-core
server.servlet.context-path=/core
server.port=${PORT}

# Import .env from current directory or parent directory
spring.config.import=optional:file:.env[.properties]

# Default Active Profile (dev / prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# MongoDB Configuration
spring.data.mongodb.auto-index-creation=true

# Security and CORS
security.cookie.same-site=${COOKIE_SAME_SITE:Lax}
security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
security.cors.allowed-headers=Authorization,Content-Type,Accept,Origin,X-Requested-With,Cookie

# Actuator Health Check & Monitoring
management.endpoints.web.exposure.include=health,info

# Suppress PageImpl serialization warning to preserve frontend PageResponse contract
logging.level.org.springframework.data.web.config=ERROR
