services:
  - type: web
    name: caliber-core
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /core/actuator/health
    dockerBuildArgs:
      - key: GITHUB_ACTOR
        value: keerthanmahesh
      - key: GITHUB_TOKEN
        sync: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8087
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: caliber
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_MINUTES
        value: 30
      - key: SERVICE_EXPIRY_DAYS
        value: 1
      - key: COOKIE_SECURE
        value: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
